[pytest]
asyncio_mode = auto
# A single session-scoped event loop for the whole run, matching the
# session-scoped `async_engine` fixture in conftest.py. Without this,
# pytest-asyncio's default per-test (function-scoped) loop can outlive an
# asyncpg connection created under an earlier test's loop, surfacing as an
# intermittent "Future attached to a different loop" RuntimeError once
# enough tests accumulate in one run.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
pythonpath = .
testpaths = backend/tests
addopts = -ra
markers =
    postgis: requires the docker-compose postgres service
    minio: requires the docker-compose minio service
