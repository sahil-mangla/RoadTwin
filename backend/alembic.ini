# Alembic configuration for RoadTwin's backend.
#
# Every invocation in this project is run from the repository root as:
#   alembic -c backend/alembic.ini <command>
#
# `sqlalchemy.url` is intentionally left empty here -- `backend/alembic/env.py`
# supplies it at runtime from `backend.core.config.settings.database_url_sync`
# (the sync psycopg URL; Alembic's engine_from_config() cannot drive the
# app's async-only asyncpg driver -- 01-RESEARCH.md Pitfall 3).

[alembic]
script_location = backend/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
